services:

  mongodb:
    image: mongo:8
    container_name: devflow-mongodb
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./server
    container_name: devflow-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/devflow
      JWT_SECRET: devflow-secret-key
    depends_on:
      - mongodb

  frontend:
    build: ./client
    container_name: devflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data: